apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybertraining-test-app
  namespace: cybertraining-test
  labels:
    app: cybertraining-test-app
    environment: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cybertraining-test-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cybertraining-test-app
        environment: test
    spec:
      containers:
        - name: nextjs
          image: zhjyu11/cybertraining:cyber-dart-20260818-755d32d@sha256:cf62cd6a6995b23cd0c6a3665a056d426a59c2ed151a45eee50d9df0cbb0d796
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: POSTGRES_HOST
              value: postgres-service
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: cybertraining
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cybertraining-test-service
  namespace: cybertraining-test
spec:
  type: ClusterIP
  selector:
    app: cybertraining-test-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybertraining-test-ingress
  namespace: cybertraining-test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: cyber-dart.geos.tamu.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybertraining-test-service
                port:
                  number: 80
